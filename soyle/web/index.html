<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>söyle</title>
<style>
  :root{ --bg:#fff8ec; --card:#fff; --ink:#2b2118; --dim:#9a8b78;
         --yes:#3faa5a; --no:#e4903f; --ring:#ffc96b; color-scheme:light }
  @media (prefers-color-scheme:dark){ :root{
         --bg:#1a1511; --card:#241d17; --ink:#f6efe4; --dim:#8c7f6e;
         --yes:#5fcf7c; --no:#f0a85c; --ring:#c8923a; color-scheme:dark } }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);display:flex;flex-direction:column;
       align-items:center;justify-content:center;gap:4vh;
       font:600 16px/1.4 -apple-system,system-ui,sans-serif;
       padding:calc(env(safe-area-inset-top,0px) + 16px) 16px
               calc(env(safe-area-inset-bottom,0px) + 16px);
       user-select:none;-webkit-user-select:none;overflow:hidden}
  .stars{font-size:clamp(20px,5vw,30px);letter-spacing:4px;min-height:1.2em}
  .card{background:var(--card);border-radius:36px;width:min(74vw,74vh,430px);
        aspect-ratio:1;display:grid;place-items:center;
        box-shadow:0 18px 50px -18px rgba(90,60,20,.4);position:relative}
  .card.ok{animation:pop .5s ease} .card.no{animation:shake .4s ease}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.11)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-11px)}
                   75%{transform:translateX(11px)}}
  .emoji{font-size:min(38vw,38vh,230px);line-height:1}
  .ring{position:absolute;inset:-14px;border-radius:46px;border:7px solid var(--ring);
        opacity:0}
  .live .ring{opacity:1;animation:breathe 1.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1);opacity:.35}50%{transform:scale(1.035);opacity:.9}}
  .heard{min-height:2.4em;font-size:clamp(20px,5.5vw,30px);color:var(--dim);
         text-align:center}
  .heard b{color:var(--yes)} .heard i{color:var(--no);font-style:normal}
  button{font:inherit;font-size:clamp(18px,4.5vw,22px);padding:14px 34px;
         border-radius:999px;border:0;background:var(--ink);color:var(--bg);
         cursor:pointer}
  button:active{transform:scale(.96)}
  .skip{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
        background:transparent;color:var(--dim);font-size:15px;padding:10px 14px}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
  <canvas id="confetti"></canvas>
  <div class="stars" id="stars"></div>
  <div class="card" id="card"><span class="ring"></span><span class="emoji" id="emoji">🙂</span></div>
  <div class="heard" id="heard">söyle</div>
  <button id="go"><span id="golabel">Başla</span></button>
  <button class="skip" id="skip" hidden>başka →</button>

<script>
(function(){
  const L=new URLSearchParams(location.search).get("lang")||"tr";
  const T={tr:{go:"Başla",skip:"başka →",hint:"söyle",mic:"mikrofon izni gerekli",end:"bitti"},
           ru:{go:"Начали",skip:"другое →",hint:"скажи",mic:"нужен доступ к микрофону",end:"конец"}}[L]||{};
  document.documentElement.lang=L;
  const IN=16000; let OUT=24000, ws,ctx,mic,src,at=0,q=[],live=false;
  const $=id=>document.getElementById(id);
  const card=$("card"), emoji=$("emoji"), heard=$("heard"), stars=$("stars");

  function down(f,rate){ if(rate===IN) return f;
    const r=rate/IN, out=new Float32Array(Math.round(f.length/r));
    for(let i=0;i<out.length;i++){ const a=Math.round(i*r),
      b=Math.min(Math.round((i+1)*r),f.length); let s=0;
      for(let j=a;j<b;j++) s+=f[j]; out[i]=s/Math.max(1,b-a); }
    return out; }
  function pcm16(f){ const b=new ArrayBuffer(f.length*2), v=new DataView(b);
    for(let i=0;i<f.length;i++){ const s=Math.max(-1,Math.min(1,f[i]));
      v.setInt16(i*2, s<0?s*0x8000:s*0x7fff, true);} return b; }
  function play(buf){ if(!ctx) return;
    const p=new Int16Array(buf), b=ctx.createBuffer(1,p.length,OUT), c=b.getChannelData(0);
    for(let i=0;i<p.length;i++) c[i]=p[i]/0x8000;
    const s=ctx.createBufferSource(); s.buffer=b; s.connect(ctx.destination);
    const now=ctx.currentTime; if(at<now) at=now+0.02;
    s.start(at); at+=b.duration; q.push(s);
    s.onended=()=>{q=q.filter(x=>x!==s)}; }
  function flush(){ q.forEach(s=>{try{s.stop()}catch(e){}}); q=[]; at=0; }

  // ---- confetti ---------------------------------------------------------
  const cv=$("confetti"), cx=cv.getContext("2d");
  let bits=[], raf=null;
  const COLORS=["#ff5d8f","#ffd166","#5fd3a5","#5aa9ff","#c58bff","#ff9f45"];
  function size(){ const r=window.devicePixelRatio||1;
    cv.width=innerWidth*r; cv.height=innerHeight*r; cx.setTransform(r,0,0,r,0,0); }
  size(); addEventListener("resize", size);

  function burst(){
    if(window.matchMedia("(prefers-reduced-motion:reduce)").matches) return;
    const box=card.getBoundingClientRect();
    const ox=box.left+box.width/2, oy=box.top+box.height/2;
    for(let i=0;i<110;i++){
      const a=Math.random()*Math.PI*2, sp=3+Math.random()*9;
      bits.push({x:ox,y:oy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-5,
                 w:5+Math.random()*7,h:8+Math.random()*10,
                 rot:Math.random()*Math.PI,spin:(Math.random()-0.5)*0.4,
                 c:COLORS[(Math.random()*COLORS.length)|0],life:1});
    }
    if(!raf) raf=requestAnimationFrame(step);
  }
  function step(){
    cx.clearRect(0,0,innerWidth,innerHeight);
    bits=bits.filter(b=>b.life>0);
    for(const b of bits){
      b.vy+=0.32; b.vx*=0.995; b.x+=b.vx; b.y+=b.vy;
      b.rot+=b.spin; b.life-=0.0085;
      cx.save(); cx.translate(b.x,b.y); cx.rotate(b.rot);
      cx.globalAlpha=Math.max(0,Math.min(1,b.life*1.6));
      cx.fillStyle=b.c; cx.fillRect(-b.w/2,-b.h/2,b.w,b.h);
      cx.restore();
    }
    raf = bits.length ? requestAnimationFrame(step)
                      : (cx.clearRect(0,0,innerWidth,innerHeight), null);
  }

  function pulse(cls){ card.classList.remove("ok","no"); void card.offsetWidth;
                       card.classList.add(cls); }

  async function start(){
    try{ mic=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,
         echoCancellation:true,noiseSuppression:true,autoGainControl:true}}); }
    catch(e){ heard.textContent=T.mic||"mikrofon izni gerekli"; return; }
    ctx=new (window.AudioContext||window.webkitAudioContext)(); await ctx.resume();
    $("go").hidden=true; $("skip").hidden=false;
    const lang=new URLSearchParams(location.search).get("lang")||"tr";
    ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws?lang="+lang);
    ws.binaryType="arraybuffer";
    ws.onmessage=ev=>{
      if(typeof ev.data!=="string"){ play(ev.data); return; }
      let m; try{ m=JSON.parse(ev.data);}catch(e){return}
      if(m.type==="ready"){ live=true; card.classList.add("live"); }
      else if(m.type==="card"){ emoji.textContent=m.emoji; heard.textContent="…";
        stars.textContent="⭐".repeat(Math.min(m.score||0,10)); }
      else if(m.type==="hearing"){ heard.textContent=m.text; }
      else if(m.type==="said"){
        heard.textContent="";
        const el=document.createElement(m.ok===true?"b":(m.ok===false?"i":"span"));
        el.textContent=m.text; heard.appendChild(el);
        if(m.ok===true) pulse("ok"); else if(m.ok===false) pulse("no"); }
      else if(m.type==="score"){ pulse("ok"); burst();
        stars.textContent="⭐".repeat(Math.min(m.score||0,10)); }
    };
    ws.onclose=()=>{ live=false; card.classList.remove("live");
                     heard.textContent=T.end||"bitti"; $("go").hidden=false; $("skip").hidden=true; };
    src=ctx.createMediaStreamSource(mic);
    const node=ctx.createScriptProcessor(4096,1,1);
    node.onaudioprocess=e=>{ if(!live||!ws||ws.readyState!==1) return;
      ws.send(pcm16(down(e.inputBuffer.getChannelData(0), ctx.sampleRate))); };
    src.connect(node); node.connect(ctx.destination);   // required to fire
  }
  if(T.go){ $("golabel").textContent=T.go; $("skip").textContent=T.skip; heard.textContent=T.hint; }
  $("go").onclick=start;
  $("skip").onclick=()=>{ if(ws&&ws.readyState===1){ flush(); ws.send("next"); } };
})();
</script>
</body>
</html>
