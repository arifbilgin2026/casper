<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>söyle</title>
<style>
  :root{ --bg:#fff8ec; --card:#fff; --ink:#2b2118; --dim:#9a8b78;
         --yes:#3faa5a; --no:#e4903f; --ring:#ffc96b; color-scheme:light }
  @media (prefers-color-scheme:dark){ :root{
         --bg:#1a1511; --card:#241d17; --ink:#f6efe4; --dim:#8c7f6e;
         --yes:#5fcf7c; --no:#f0a85c; --ring:#c8923a; color-scheme:dark } }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);display:flex;flex-direction:column;
       align-items:center;justify-content:center;gap:4vh;
       font:600 16px/1.4 -apple-system,system-ui,sans-serif;
       padding:calc(env(safe-area-inset-top,0px) + 16px) 16px
               calc(env(safe-area-inset-bottom,0px) + 16px);
       user-select:none;-webkit-user-select:none;overflow:hidden}
  .stars{font-size:clamp(20px,5vw,30px);letter-spacing:4px;min-height:1.2em}
  .card{background:var(--card);border-radius:36px;width:min(74vw,74vh,430px);
        aspect-ratio:1;display:grid;place-items:center;
        box-shadow:0 18px 50px -18px rgba(90,60,20,.4);position:relative}
  .card.ok{animation:pop .5s ease} .card.no{animation:shake .4s ease}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.11)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-11px)}
                   75%{transform:translateX(11px)}}
  .emoji{font-size:min(38vw,38vh,230px);line-height:1}
  .ring{position:absolute;inset:-14px;border-radius:46px;border:7px solid var(--ring);
        opacity:0}
  .live .ring{opacity:1;animation:breathe 1.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1);opacity:.35}50%{transform:scale(1.035);opacity:.9}}
  .heard{min-height:2.4em;font-size:clamp(20px,5.5vw,30px);color:var(--dim);
         text-align:center}
  .heard b{color:var(--yes)} .heard i{color:var(--no);font-style:normal}
  button{font:inherit;font-size:clamp(18px,4.5vw,22px);padding:14px 34px;
         border-radius:999px;border:0;background:var(--ink);color:var(--bg);
         cursor:pointer}
  button:active{transform:scale(.96)}
  .skip{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
        background:transparent;color:var(--dim);font-size:15px;padding:10px 14px}
  .bye{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
       background:transparent;color:var(--dim);font-size:15px;padding:10px 14px}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
  /* the grown-up's gate: one small card, then never seen again */
  .auth{background:var(--card);border-radius:24px;padding:28px;width:min(88vw,360px);
        display:flex;flex-direction:column;gap:12px;
        box-shadow:0 18px 50px -18px rgba(90,60,20,.4)}
  .auth h1{margin:0;font-size:26px}
  .auth p{margin:0;color:var(--dim);font-weight:500;font-size:14px}
  .auth input,.auth select{font:inherit;font-weight:500;padding:11px 14px;
        border-radius:12px;border:1.5px solid var(--dim);background:var(--bg);
        color:var(--ink);width:100%}
  .auth .err{color:var(--no);font-size:14px;min-height:1.2em;font-weight:500}
  .auth .alt{background:transparent;color:var(--dim);font-size:14px;padding:4px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
  <canvas id="confetti"></canvas>

  <!-- the grown-up signs in once; the child never touches the screen -->
  <div class="auth" id="auth" hidden>
    <h1>söyle</h1>
    <p id="authblurb">a talking picture game for toddlers</p>
    <input id="email" type="email" placeholder="email" autocomplete="username">
    <input id="password" type="password" placeholder="password (6+)"
           autocomplete="current-password">
    <input id="childName" type="text" placeholder="child's name" hidden>
    <select id="langpick" hidden>
      <option value="tr">Türkçe</option>
      <option value="ru">Русский</option>
      <option value="en">English</option>
    </select>
    <div class="err" id="autherr"></div>
    <button id="authgo">Sign in</button>
    <button class="alt" id="authswap">new here? create an account</button>
  </div>

  <div class="stars" id="stars"></div>
  <div class="card" id="card" hidden><span class="ring"></span><span class="emoji" id="emoji">🙂</span></div>
  <div class="heard" id="heard" hidden>söyle</div>
  <button id="go" hidden><span id="golabel">Başla</span></button>
  <button class="skip" id="skip" hidden>başka →</button>
  <button class="bye" id="bye" hidden>×</button>

<!-- All behaviour lives in app.ts (compiled to app.js) — auth flow, mic
     capture, playback, the wire protocol, confetti. This file is only the
     markup and the look. -->
<script src="app.js"></script>
</body>
</html>
